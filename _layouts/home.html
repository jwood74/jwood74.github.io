<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <meta name="theme-color" content="#f7f7f2">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Jaxen Wood home">Jaxen Wood</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="https://github.com/jwood74">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div class="footer-main">
        <p>Jaxen Wood <span class="footer-dot" aria-hidden="true">·</span> Made with curiosity.</p>
        <div class="footer-links"><a href="mailto:jaxen@jaxenwood.com">Email <span aria-hidden="true">↗</span></a><a href="https://github.com/jwood74">GitHub <span aria-hidden="true">↗</span></a><a href="#top">Back to top <span aria-hidden="true">↑</span></a></div>
      </div>
      {% if page.url == '/' %}<p class="map-credits">Map previews: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>, <a href="https://openfreemap.org/">OpenFreeMap</a> &amp; <a href="https://www.openmaptiles.org/">OpenMapTiles</a>.</p>{% endif %}
    </footer>
  </div>
</body>
</html>
